# Example Config that uses almost all values

alg: TD3
alg_kwargs:
  tau: 0.005
  policy_noise: 0.02
  target_noise: 0.04
  noise_clip: 0.1
  critic_freq: 1
  actor_freq: 2
  target_freq: 2
  random_steps: 0
  bc_coeff: 0.5

optim: Adam
optim_kwargs:
  lr: 0.0001

network: ActorCriticPolicy
network_kwargs:
  actor_class: ContinuousMLPActor
  actor_kwargs:
    hidden_layers: [256, 256]
    output_act: ["import", "torch.nn", "Tanh"]
  critic_class: ContinuousMLPCritic
  critic_kwargs:
    hidden_layers: [256, 256]
    ensemble_size: 2
  ortho_init: true

env: SimplerEnvRLDSWrapper
env_kwargs:
  task: widowx_carrot_on_plate
  initial_states_path: train
  horizon: 60

dataset: SimplerDataset
dataset_kwargs:
  path: /iliad/u/joycech/tensorflow_datasets/simpler_widowx_carrot_openvla_bridge_7b_temp1_0_rollouts
  sample_fn: sample_qlearning
  sample_kwargs:
    discount: 0.99
    nstep: 1
    batch_size: 256
    sample_by_timesteps: False
  capacity: 1000000
  fetch_every: 500
  distributed: False

processor: Compose
processor_kwargs:
  processors: # Format is List[Tuple(Name, kwargs)]
  - ["Concatenate", {}]
  - ["MinMaxActionNormalizer", 
      {
        "low": [-0.03, -0.02, -0.03, -0.08, -0.09, -0.04, 0.0],
        "high": [0.03, 0.03, 0.04, 0.07, 0.05, 0.11, 1.0]
      }
    ]
schedule: null # A learning rate schedule
checkpoint: null # A checkpoint to initialize the model from

trainer_kwargs: # Arguments given to Algorithm.train
  total_steps: 1000000 # The total number of steps to train
  log_freq: 250 # How often to log values
  profile_freq: 100
  eval_freq: 10000 # How often to run evals
  eval_fn: eval_policy
  eval_kwargs:
    num_ep: 10 # Number of enviornment episodes to run for evaluation, or -1 if none should be run.
    terminate_on_success: True
    predict_kwargs: {unprocess: True}
  loss_metric: reward # The validation metric that determines when to save the "best_checkpoint"]
  max_validation_steps: 25
  train_dataloader_kwargs:
    num_workers: 0 # Number of dataloader workers.